version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotel_booking_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SECRET_KEY=hotel_frontdesk_production_secret_key_123
      - DATABASE_URL=sqlite:///./hotel_booking.db
      - CORS_ORIGINS=*
    volumes:
      - ./hotel_booking.db:/app/hotel_booking.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hotel_booking_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
